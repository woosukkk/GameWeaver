name: Record commits in Notion

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
      NOTION_VERSION: "2026-03-11"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate configuration
        shell: bash
        run: |
          test -n "$NOTION_TOKEN" || { echo "Missing NOTION_TOKEN secret"; exit 1; }
          test -n "$NOTION_DATA_SOURCE_ID" || { echo "Missing NOTION_DATA_SOURCE_ID variable"; exit 1; }

      - name: Record pushed commits
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail

          if [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            commits=("$AFTER_SHA")
          else
            mapfile -t commits < <(git rev-list --reverse "$BEFORE_SHA..$AFTER_SHA")
          fi

          for sha in "${commits[@]}"; do
            subject="$(git show -s --format=%s "$sha")"
            summary="$(git show -s --format=%b "$sha" | sed '/^[[:space:]]*$/d')"
            [[ -n "$summary" ]] || summary="$subject"
            files="$(git diff-tree --root --no-commit-id --name-only -r "$sha" | paste -sd ',' - | sed 's/,/, /g')"
            [[ -n "$files" ]] || files="(no file list)"
            author="$(git show -s --format=%an "$sha")"
            committed_at="$(git show -s --format=%cI "$sha")"
            commit_url="$SERVER_URL/$REPOSITORY/commit/$sha"
            type="${subject%%:*}"

            case "$type" in
              feat|fix|docs|style|design|test|refactor|chore|rename|remove) ;;
              *) type="chore" ;;
            esac

            subject="${subject:0:200}"
            summary="${summary:0:1900}"
            files="${files:0:1900}"

            query="$(jq -n --arg sha "$sha" '{filter:{property:"SHA",rich_text:{equals:$sha}},page_size:1}')"
            existing="$(curl --fail-with-body --silent --show-error \
              -X POST "https://api.notion.com/v1/data_sources/$NOTION_DATA_SOURCE_ID/query" \
              -H "Authorization: Bearer $NOTION_TOKEN" \
              -H "Notion-Version: $NOTION_VERSION" \
              -H "Content-Type: application/json" \
              --data "$query")"

            if [[ "$(jq '.results | length' <<<"$existing")" -gt 0 ]]; then
              echo "Already recorded: $sha"
              continue
            fi

            payload="$(jq -n \
              --arg data_source_id "$NOTION_DATA_SOURCE_ID" \
              --arg subject "$subject" \
              --arg repository "$REPOSITORY" \
              --arg branch "$BRANCH" \
              --arg type "$type" \
              --arg summary "$summary" \
              --arg files "$files" \
              --arg author "$author" \
              --arg sha "$sha" \
              --arg url "$commit_url" \
              --arg committed_at "$committed_at" \
              '{
                parent:{type:"data_source_id",data_source_id:$data_source_id},
                properties:{
                  Commit:{title:[{text:{content:$subject}}]},
                  Repository:{rich_text:[{text:{content:$repository}}]},
                  Branch:{rich_text:[{text:{content:$branch}}]},
                  Type:{select:{name:$type}},
                  Summary:{rich_text:[{text:{content:$summary}}]},
                  Files:{rich_text:[{text:{content:$files}}]},
                  Author:{rich_text:[{text:{content:$author}}]},
                  SHA:{rich_text:[{text:{content:$sha}}]},
                  URL:{url:$url},
                  "Committed At":{date:{start:$committed_at}}
                }
              }')"

            curl --fail-with-body --silent --show-error \
              -X POST "https://api.notion.com/v1/pages" \
              -H "Authorization: Bearer $NOTION_TOKEN" \
              -H "Notion-Version: $NOTION_VERSION" \
              -H "Content-Type: application/json" \
              --data "$payload" >/dev/null

            echo "Recorded: $sha"
          done
