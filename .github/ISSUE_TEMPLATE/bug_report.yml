name: 버그 제보
description: 기존 기능에서 재현되는 문제를 제보합니다
title: "[버그] "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: 발생한 문제
      description: 어떤 문제가 발생했는지 최대한 자세히 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 문제를 다시 발생시킬 수 있는 순서를 작성해 주세요.
      placeholder: |
        1. ...로 이동
        2. ...를 실행
        3. 문제 확인
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 완료 조건
      description: 수정 완료를 확인할 수 있는 정상 동작과 검사 조건을 작성해 주세요.
      placeholder: |
        - [ ] 문제가 재현되지 않는다
        - [ ] 관련 회귀 검사가 통과한다
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
      description: 실제로 나타난 결과를 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: OS, 브라우저, 런타임, 앱 버전 또는 커밋을 작성해 주세요.
  - type: textarea
    id: code_logs
    attributes:
      label: 관련 코드 및 로그
      description: 관련 코드나 로그를 추가하고 비밀정보와 개인정보는 제거해 주세요.
      render: shell
